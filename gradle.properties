org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# --- Release signing --------------------------------------------------------
# Generate a keystore with the keytool command in README.md, then uncomment and
# fill these in. Without them, assembleRelease falls back to the debug keystore
# (still installable for sideloading, but not suitable for distribution).
#SNIPPET_STORE_FILE=/absolute/path/to/snippet-release.keystore
#SNIPPET_STORE_PASSWORD=change-me
#SNIPPET_KEY_ALIAS=snippet
#SNIPPET_KEY_PASSWORD=change-me
